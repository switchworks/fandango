[meta]
name = "fandango"
author = "switchworks"
youtube_id = "sUw1qtUrsVs"

[tagline]
ja = "式で閉じる。だから、壊れない。"
en = "Closed form. So it never breaks."

# 散文は断片ファイルへの参照。パスは copy/ からの相対
