[package]
name = "fandango-shots"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fandango-shots"
path = "src/main.rs"

[dependencies]
egui = "0.31.1"
nih_plug = { workspace = true }
nih_plug_egui = { workspace = true }
fandango-shared = { workspace = true }
fandango-crush = { path = "../crush", default-features = false }
fandango-drawl = { path = "../drawl", default-features = false }
fandango-finalist = { path = "../finalist", default-features = false }
fandango-gate = { path = "../gate", default-features = false }
fandango-nice-bulk = { path = "../nice-bulk", default-features = false }
fandango-nimbus = { path = "../nimbus", default-features = false }
fandango-raindrop = { path = "../raindrop", default-features = false }
fandango-rotate = { path = "../rotate", default-features = false }
fandango-spread = { path = "../spread", default-features = false }
fandango-tilt = { path = "../tilt", default-features = false }
fandango-trip-delay = { path = "../trip-delay", default-features = false }
fandango-velvet = { path = "../velvet", default-features = false }
egui_glow = "0.31.1"
glow = "0.16"
glutin = "0.32"
glutin-winit = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
winit = "0.30.13"

[dev-dependencies]
# 収録コピー (copy.toml) と Target 列挙の集合一致を検査するため
# (plans/copy_source_v01.md 不変条件 3)。配布物には入らない。
fandango-copy = { path = "../copy" }
